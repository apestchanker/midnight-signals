<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="passport-title passport-desc" font-family="Arial, Helvetica, sans-serif"><title id="passport-title">Passport: the intended experience</title><desc id="passport-desc">Passport targets passkey-based accounts and bounded, revocable application permissions. The current demo is experimental and limited to Stagenet.</desc><rect width="1000" height="780" rx="24" fill="#0e101c"/><path d="M720 0L1000 280M800 0L1000 200M880 0L1000 120" stroke="#26253f" stroke-width="2"/><text x="48" y="53" fill="#a78bfa" font-size="19" letter-spacing="4">MIDNIGHT SIGNALS / LATE NOVEMBER</text><text x="48" y="115" fill="#fff" font-size="38" font-weight="700">Passport: the intended experience</text><text x="48" y="153" fill="#b5b5c5" font-size="20" letter-spacing="2">PRODUCT TARGET · PROTOTYPE ON STAGENET</text><rect x="48" y="192" width="904" height="132" rx="16" fill="#171a2b" stroke="#a78bfa" stroke-opacity=".65"/><circle cx="101" cy="257" r="29" fill="#a78bfa" fill-opacity=".16"/><text x="101" y="265" text-anchor="middle" fill="#a78bfa" font-size="24" font-weight="700">01</text><text x="153" y="241" fill="#a78bfa" font-size="22" font-weight="700">CREATE YOUR ACCOUNT</text><text x="153" y="281" fill="#fff" font-size="25">Use a passkey and a named account</text><path d="M101 325v22m-6-6l6 6 6-6" fill="none" stroke="#77718f" stroke-width="2"/><rect x="48" y="349" width="904" height="132" rx="16" fill="#171a2b" stroke="#38bdf8" stroke-opacity=".65"/><circle cx="101" cy="414" r="29" fill="#38bdf8" fill-opacity=".16"/><text x="101" y="422" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="700">02</text><text x="153" y="398" fill="#38bdf8" font-size="22" font-weight="700">AUTHORIZE AN APPLICATION</text><text x="153" y="438" fill="#fff" font-size="25">Approve a grant with limits and an expiry</text><path d="M101 482v22m-6-6l6 6 6-6" fill="none" stroke="#77718f" stroke-width="2"/><rect x="48" y="506" width="904" height="132" rx="16" fill="#171a2b" stroke="#34d399" stroke-opacity=".65"/><circle cx="101" cy="571" r="29" fill="#34d399" fill-opacity=".16"/><text x="101" y="579" text-anchor="middle" fill="#34d399" font-size="24" font-weight="700">03</text><text x="153" y="555" fill="#34d399" font-size="22" font-weight="700">STAY IN CONTROL</text><text x="153" y="595" fill="#fff" font-size="25">Manage devices and revoke permissions</text><text x="48" y="701" fill="#c4c4d4" font-size="21">Target journey. Public Mainnet availability is not confirmed as of Nov 17.</text><text x="48" y="745" fill="#81859c" font-size="18">Research cutoff: 17 Nov 2026 · Sources and scope in the edition</text></svg>