<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Space Grotesk', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#b16cff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#8b5cf6" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#05050b"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(0 430) skewX(-32)" opacity="0.5">
    <rect x="-200" y="0" width="1600" height="260" fill="url(#grid)"/>
  </g>

  <g transform="translate(90 150)">
    <circle cx="26" cy="26" r="24" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="17" cy="26" r="3.4" fill="#fff"/>
    <rect x="30" y="12" width="7" height="7" rx="1.2" fill="#fff"/>
    <rect x="30" y="33" width="7" height="7" rx="1.2" fill="#fff"/>
    <text x="66" y="40" font-size="40" font-weight="600" fill="#fff">midnight</text>
  </g>

  <text x="88" y="330" font-size="130" font-weight="700" letter-spacing="-4" fill="#fff">SIGNALS</text>
  <text x="92" y="392" font-size="26" letter-spacing="8" fill="#a2a2be">TECHNICAL UPDATES FOR DEVELOPERS</text>
  <rect x="92" y="418" width="360" height="3" fill="url(#g)"/>

  <g font-family="'JetBrains Mono', monospace" font-size="19" transform="translate(760 120)" opacity="0.85">
    <text y="0" fill="#6f6f8a">01  <tspan fill="#b16cff">import</tspan><tspan fill="#f5f5fa"> { Midnight } </tspan><tspan fill="#b16cff">from</tspan><tspan fill="#7dd3fc"> 'midnight'</tspan></text>
    <text y="30" fill="#6f6f8a">02  <tspan fill="#b16cff">const</tspan><tspan fill="#f5f5fa"> app = </tspan><tspan fill="#b16cff">new</tspan><tspan fill="#8b5cf6"> Midnight</tspan><tspan fill="#f5f5fa">();</tspan></text>
    <text y="90" fill="#6f6f8a">04  <tspan fill="#f5f5fa">app.</tspan><tspan fill="#8b5cf6">build</tspan><tspan fill="#f5f5fa">();</tspan></text>
    <text y="120" fill="#6f6f8a">05  <tspan fill="#f5f5fa">app.</tspan><tspan fill="#8b5cf6">deploy</tspan><tspan fill="#f5f5fa">();</tspan></text>
    <text y="180" fill="#6f6f8a">07  <tspan fill="#6f6f8a" font-style="italic">// privacy by default</tspan></text>
  </g>

  <g transform="translate(92 470)" font-family="'JetBrains Mono', monospace" font-size="18" letter-spacing="3" fill="#a2a2be">
    <text x="0" y="0">PRIVACY</text>
    <text x="180" y="0">BUILD</text>
    <text x="320" y="0">DEVELOP</text>
    <text x="500" y="0">DEPLOY</text>
  </g>
</svg>
